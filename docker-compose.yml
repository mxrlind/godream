version: '3.9'

services:
  # ─── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: godream_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: godream
      POSTGRES_PASSWORD: godream_dev_password
      POSTGRES_DB: godream_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U godream -d godream_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (sessions, queues, cache) ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: godream_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (local S3-compatible storage) ─────────────────────
  minio:
    image: minio/minio:latest
    container_name: godream_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: godream_admin
      MINIO_ROOT_PASSWORD: godream_minio_password
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    command: server /data --console-address ':9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  # ─── NestJS API ───────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: godream_api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://godream:godream_dev_password@postgres:5432/godream_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_replace_in_production
      JWT_REFRESH_SECRET: dev_refresh_secret_replace_in_production
    ports:
      - '3001:3001'
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: pnpm run start:dev

  # ─── Next.js Frontend ─────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    container_name: godream_web
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
    ports:
      - '3000:3000'
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: pnpm run dev

  # ─── pgAdmin (optional DB UI) ─────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: godream_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@godream.io
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: godream_network
