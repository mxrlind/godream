# fly.toml app configuration (monorepo - root config)
app = "godream"
primary_region = "gig"

[build]
  builder = "heroku"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[services]]
  protocol = "tcp"
  internal_port = 3000
  ports = [{ port = 80, handlers = ["http"] }, { port = 443, handlers = ["tls", "http"] }]
  [services.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800
  [[services.tcp_checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
